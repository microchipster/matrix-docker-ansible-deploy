---

- name: (Deprecation) Catch and report renamed mautrix-jmpchat variables
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please rename the variable (`{{ item.old }}` -> `{{ item.new }}`) on your configuration file (vars.yml).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - {'old': 'matrix_bridge_mautrix_jmpchat_log_level', 'new': 'matrix_bridge_mautrix_jmpchat_logging_level'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_bridge_restricted_rooms', 'new': '<removed>'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_bridge_note_to_self_avatar', 'new': 'matrix_bridge_mautrix_jmpchat_network_note_to_self_avatar'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_login_shared_secret', 'new': '<removed>'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_bridge_login_shared_secret_map', 'new': '<superseded by matrix_bridge_mautrix_jmpchat_double_puppet_secrets>'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_bridge_double_puppet_server_map', 'new': '<removed>'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_docker_image_name_prefix', 'new': 'matrix_bridge_mautrix_jmpchat_container_image_registry_prefix'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_docker_image', 'new': 'matrix_bridge_mautrix_jmpchat_container_image'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_docker_image_force_pull', 'new': 'matrix_bridge_mautrix_jmpchat_container_image_force_pull'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_docker_image_registry_prefix', 'new': 'matrix_bridge_mautrix_jmpchat_container_image_registry_prefix'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_docker_image_registry_prefix_upstream', 'new': 'matrix_bridge_mautrix_jmpchat_container_image_registry_prefix_upstream'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_docker_image_registry_prefix_upstream_default', 'new': 'matrix_bridge_mautrix_jmpchat_container_image_registry_prefix_upstream_default'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_docker_image_tag', 'new': 'matrix_bridge_mautrix_jmpchat_container_image_tag'}
    - {'old': 'matrix_bridge_mautrix_jmpchat_docker_src_files_path', 'new': 'matrix_bridge_mautrix_jmpchat_container_src_files_path'}

- name: Fail if required mautrix-jmpchat settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item.name }}`).
  when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
  with_items:
    - {'name': 'matrix_bridge_mautrix_jmpchat_appservice_token', when: true}
    - {'name': 'matrix_bridge_mautrix_jmpchat_homeserver_address', when: true}
    - {'name': 'matrix_bridge_mautrix_jmpchat_homeserver_token', when: true}
    - {'name': 'matrix_bridge_mautrix_jmpchat_database_hostname', when: "{{ matrix_bridge_mautrix_jmpchat_database_engine == 'postgres' }}"}
    - {'name': 'matrix_bridge_mautrix_jmpchat_container_network', when: true}
    - {'name': 'matrix_bridge_mautrix_jmpchat_metrics_proxying_hostname', when: "{{ matrix_bridge_mautrix_jmpchat_metrics_proxying_enabled }}"}
    - {'name': 'matrix_bridge_mautrix_jmpchat_metrics_proxying_path_prefix', when: "{{ matrix_bridge_mautrix_jmpchat_metrics_proxying_enabled }}"}
