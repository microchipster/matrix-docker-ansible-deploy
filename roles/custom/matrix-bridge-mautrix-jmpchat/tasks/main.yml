---

- tags:
    - setup-all
    - setup-mautrix-jmpchat
    - install-all
    - install-mautrix-jmpchat
  block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tasks/remove_legacy.yml"

- tags:
    - setup-all
    - setup-mautrix-jmpchat
    - install-all
    - install-mautrix-jmpchat
  block:
    - when: matrix_bridge_mautrix_jmpchat_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"

    - when: matrix_bridge_mautrix_jmpchat_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/setup_install.yml"

- tags:
    - setup-all
    - setup-mautrix-jmpchat
  block:
    - when: not matrix_bridge_mautrix_jmpchat_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/setup_uninstall.yml"
