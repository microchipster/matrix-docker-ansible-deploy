---

- ansible.builtin.set_fact:
    matrix_bridge_mautrix_jmpchat_migration_requires_restart: false

- when: "matrix_bridge_mautrix_jmpchat_database_engine == 'postgres'"
  block:
    - name: Check if an SQLite database already exists
      ansible.builtin.stat:
        path: "{{ matrix_bridge_mautrix_jmpchat_sqlite_database_path_local }}"
      register: matrix_bridge_mautrix_jmpchat_sqlite_database_path_local_stat_result

    - when: "matrix_bridge_mautrix_jmpchat_sqlite_database_path_local_stat_result.stat.exists | bool"
      block:
        - ansible.builtin.include_role:
            name: galaxy/postgres
            tasks_from: migrate_db_to_postgres
          vars:
            postgres_db_migration_request:
              src: "{{ matrix_bridge_mautrix_jmpchat_sqlite_database_path_local }}"
              dst: "{{ matrix_bridge_mautrix_jmpchat_database_connection_string }}"
              caller: "{{ role_path | basename }}"
              engine_variable_name: 'matrix_bridge_mautrix_jmpchat_database_engine'
              engine_old: 'sqlite'
              systemd_services_to_stop: ['matrix-mautrix-jmpchat.service']
              pgloader_options: ['--with "quote identifiers"']

        - ansible.builtin.set_fact:
            matrix_bridge_mautrix_jmpchat_migration_requires_restart: true

- name: Ensure Mautrix jmpchat paths exists
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0750'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  with_items:
    - {path: "{{ matrix_bridge_mautrix_jmpchat_base_path }}", when: true}
    - {path: "{{ matrix_bridge_mautrix_jmpchat_config_path }}", when: true}
    - {path: "{{ matrix_bridge_mautrix_jmpchat_data_path }}", when: true}
    - {path: "{{ matrix_bridge_mautrix_jmpchat_container_src_files_path }}", when: "{{ matrix_bridge_mautrix_jmpchat_container_image_self_build }}"}
  when: item.when | bool

- name: Ensure Mautrix jmpchat image is pulled
  community.docker.docker_image_pull:
    name: "{{ matrix_bridge_mautrix_jmpchat_container_image }}"
    pull: "{{ 'always' if matrix_bridge_mautrix_jmpchat_container_image_force_pull | bool else 'missing' }}"
  when: not matrix_bridge_mautrix_jmpchat_container_image_self_build
  register: matrix_bridge_mautrix_jmpchat_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: matrix_bridge_mautrix_jmpchat_container_image_pull_result is not failed

- name: Ensure Mautrix jmpchat repository ownership is correct on self-build
  ansible.builtin.file:
    path: "{{ matrix_bridge_mautrix_jmpchat_container_src_files_path }}"
    state: directory
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
    recurse: true
  when: "matrix_bridge_mautrix_jmpchat_container_image_self_build | bool"

- name: Ensure Mautrix jmpchat repository is present on self-build
  ansible.builtin.git:
    repo: "{{ matrix_bridge_mautrix_jmpchat_container_image_self_build_repo }}"
    dest: "{{ matrix_bridge_mautrix_jmpchat_container_src_files_path }}"
    version: "{{ matrix_bridge_mautrix_jmpchat_container_image_self_build_branch }}"
    force: "yes"
  become: true
  become_user: "{{ matrix_user_name }}"
  register: matrix_bridge_mautrix_jmpchat_git_pull_results
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: matrix_bridge_mautrix_jmpchat_git_pull_results is not failed
  when: "matrix_bridge_mautrix_jmpchat_container_image_self_build | bool"

- name: Ensure Mautrix jmpchat Docker image is built
  community.docker.docker_image_build:
    name: "{{ matrix_bridge_mautrix_jmpchat_container_image }}"
    path: "{{ matrix_bridge_mautrix_jmpchat_container_src_files_path }}"
    dockerfile: Dockerfile
    pull: true
    rebuild: "{{ 'always' if matrix_bridge_mautrix_jmpchat_git_pull_results.changed | bool else 'never' }}"
  register: matrix_bridge_mautrix_jmpchat_container_image_build_result
  when: "matrix_bridge_mautrix_jmpchat_container_image_self_build | bool"

- name: Check if Mautrix jmpchat Docker image exists
  community.docker.docker_image_info:
    name: "{{ matrix_bridge_mautrix_jmpchat_container_image }}"
  register: matrix_bridge_mautrix_jmpchat_container_image_info
  when: "matrix_bridge_mautrix_jmpchat_container_image_self_build | bool"

- name: Fail if Mautrix jmpchat Docker image does not exist
  ansible.builtin.fail:
    msg: "The Mautrix jmpchat Docker image {{ matrix_bridge_mautrix_jmpchat_container_image }} does not exist. Please check build logs."
  when:
    - matrix_bridge_mautrix_jmpchat_container_image_self_build | bool
    - matrix_bridge_mautrix_jmpchat_container_image_info.images | length == 0

- name: Check if an old database file exists
  ansible.builtin.stat:
    path: "{{ matrix_bridge_mautrix_jmpchat_base_path }}/mautrix-jmpchat.db"
  register: matrix_bridge_mautrix_jmpchat_stat_database

- name: Check if an old Matrix state file exists
  ansible.builtin.stat:
    path: "{{ matrix_bridge_mautrix_jmpchat_base_path }}/mx-state.json"
  register: matrix_bridge_mautrix_jmpchat_stat_mx_state

- name: (Data relocation) Ensure matrix-mautrix-jmpchat.service is stopped
  ansible.builtin.service:
    name: matrix-mautrix-jmpchat
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false
  when: "matrix_bridge_mautrix_jmpchat_stat_database.stat.exists"

- name: (Data relocation) Move mautrix-jmpchat database file to ./data directory
  ansible.builtin.command:
    cmd: "mv {{ matrix_bridge_mautrix_jmpchat_base_path }}/mautrix-jmpchat.db {{ matrix_bridge_mautrix_jmpchat_data_path }}/mautrix-jmpchat.db"
    creates: "{{ matrix_bridge_mautrix_jmpchat_data_path }}/mautrix-jmpchat.db"
    removes: "{{ matrix_bridge_mautrix_jmpchat_base_path }}/mautrix-jmpchat.db"
  when: "matrix_bridge_mautrix_jmpchat_stat_database.stat.exists"

- name: (Data relocation) Move mautrix-jmpchat mx-state file to ./data directory
  ansible.builtin.command:
    cmd: "mv {{ matrix_bridge_mautrix_jmpchat_base_path }}/mx-state.json {{ matrix_bridge_mautrix_jmpchat_data_path }}/mx-state.json"
    creates: "{{ matrix_bridge_mautrix_jmpchat_data_path }}/mx-state.json"
    removes: "{{ matrix_bridge_mautrix_jmpchat_base_path }}/mx-state.json"
  when: "matrix_bridge_mautrix_jmpchat_stat_mx_state.stat.exists"

- name: Ensure mautrix-jmpchat config.yaml installed
  ansible.builtin.copy:
    content: "{{ matrix_bridge_mautrix_jmpchat_configuration | to_nice_yaml(indent=2, width=999999) }}"
    dest: "{{ matrix_bridge_mautrix_jmpchat_config_path }}/config.yaml"
    mode: '0640'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  register: matrix_bridge_mautrix_jmpchat_config_result

- name: Ensure mautrix-jmpchat registration.yaml installed
  ansible.builtin.copy:
    content: "{{ matrix_bridge_mautrix_jmpchat_registration | to_nice_yaml(indent=2, width=999999) }}"
    dest: "{{ matrix_bridge_mautrix_jmpchat_config_path }}/registration.yaml"
    mode: '0640'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  register: matrix_bridge_mautrix_jmpchat_registration_result

- name: Ensure mautrix-jmpchat simple-config.yaml installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/simple-config.yaml.j2"
    dest: "{{ matrix_bridge_mautrix_jmpchat_data_path }}/simple-config.yaml"
    mode: '0640'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  register: matrix_bridge_mautrix_jmpchat_simple_config_result

- name: Ensure mautrix-jmpchat support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ matrix_bridge_mautrix_jmpchat_base_path }}/{{ item }}"
    mode: '0640'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  with_items:
    - labels
  register: matrix_bridge_mautrix_jmpchat_support_files_result

- name: Ensure matrix-mautrix-jmpchat container network is created
  community.general.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ matrix_bridge_mautrix_jmpchat_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"

- name: Ensure matrix-mautrix-jmpchat.service installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/matrix-mautrix-jmpchat.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/matrix-mautrix-jmpchat.service"
    mode: '0644'
  register: matrix_bridge_mautrix_jmpchat_systemd_service_result

- name: Determine whether matrix-mautrix-jmpchat needs a restart
  ansible.builtin.set_fact:
    matrix_bridge_mautrix_jmpchat_restart_necessary: >-
      {{
        matrix_bridge_mautrix_jmpchat_migration_requires_restart | default(false)
        or matrix_bridge_mautrix_jmpchat_config_result.changed | default(false)
        or matrix_bridge_mautrix_jmpchat_registration_result.changed | default(false)
        or matrix_bridge_mautrix_jmpchat_simple_config_result.changed | default(false)
        or matrix_bridge_mautrix_jmpchat_support_files_result.changed | default(false)
        or matrix_bridge_mautrix_jmpchat_systemd_service_result.changed | default(false)
        or matrix_bridge_mautrix_jmpchat_container_image_pull_result.changed | default(false)
        or matrix_bridge_mautrix_jmpchat_container_image_build_result.changed | default(false)
      }}

# The systemd_service_manager role (running near the end of the play) restarts
# services whose `restart_necessary` flag is set. The role-local restart below is
# only for database migrations, where the old process must release the database
# before the manager phase runs.
- name: Ensure matrix-mautrix-jmpchat.service restarted, if necessary
  ansible.builtin.service:
    name: "matrix-mautrix-jmpchat.service"
    state: restarted
    daemon_reload: true
  when: "matrix_bridge_mautrix_jmpchat_migration_requires_restart | bool"
