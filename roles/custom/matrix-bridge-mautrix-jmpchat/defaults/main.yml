---
# mautrix-jmpchat is a Matrix <-> jmp.chat bridge
# Project source code URL: https://github.com/mautrix/jmpchat

matrix_bridge_mautrix_jmpchat_enabled: false

matrix_bridge_mautrix_jmpchat_container_image_self_build: true
matrix_bridge_mautrix_jmpchat_container_image_self_build_repo: "https://github.com/microchipster/mautrix-jmpchat.git"
matrix_bridge_mautrix_jmpchat_container_image_self_build_branch: "{{ 'main' if matrix_bridge_mautrix_jmpchat_version == 'v0.2602.0' else matrix_bridge_mautrix_jmpchat_version }}"

# Controls whether the container image is built on the machine running Ansible
# and copied to the server instead of being built on the server (see docs/local-image-preloading.md).
matrix_bridge_mautrix_jmpchat_container_image_preload: false

# renovate: datasource=docker depName=dock.mau.dev/mautrix/jmpchat
matrix_bridge_mautrix_jmpchat_version: v0.2602.0

# See: https://mau.dev/mautrix/jmpchat/container_registry
matrix_bridge_mautrix_jmpchat_container_image: "{{ matrix_bridge_mautrix_jmpchat_container_image_registry_prefix }}mautrix/jmpchat:{{ matrix_bridge_mautrix_jmpchat_container_image_tag }}"
matrix_bridge_mautrix_jmpchat_container_image_tag: "{{ matrix_bridge_mautrix_jmpchat_version }}"
matrix_bridge_mautrix_jmpchat_container_image_registry_prefix: "{{ 'localhost/' if matrix_bridge_mautrix_jmpchat_container_image_self_build else matrix_bridge_mautrix_jmpchat_container_image_registry_prefix_upstream }}"
matrix_bridge_mautrix_jmpchat_container_image_registry_prefix_upstream: "{{ matrix_bridge_mautrix_jmpchat_container_image_registry_prefix_upstream_default }}"
matrix_bridge_mautrix_jmpchat_container_image_registry_prefix_upstream_default: "dock.mau.dev/"
matrix_bridge_mautrix_jmpchat_container_image_force_pull: "{{ matrix_bridge_mautrix_jmpchat_container_image.endswith(':latest') }}"

matrix_bridge_mautrix_jmpchat_base_path: "{{ matrix_base_data_path }}/mautrix-jmpchat"
matrix_bridge_mautrix_jmpchat_config_path: "{{ matrix_bridge_mautrix_jmpchat_base_path }}/config"
matrix_bridge_mautrix_jmpchat_data_path: "{{ matrix_bridge_mautrix_jmpchat_base_path }}/data"
matrix_bridge_mautrix_jmpchat_container_src_files_path: "{{ matrix_bridge_mautrix_jmpchat_base_path }}/docker-src"

matrix_bridge_mautrix_jmpchat_homeserver_address: ""
matrix_bridge_mautrix_jmpchat_homeserver_domain: "{{ matrix_domain }}"
# Whether asynchronous uploads via MSC2246 should be enabled for media.
# Requires a homeserver that supports MSC2246 (https://github.com/matrix-org/matrix-spec-proposals/pull/2246).
matrix_bridge_mautrix_jmpchat_homeserver_async_media: false
matrix_bridge_mautrix_jmpchat_appservice_address: "http://matrix-mautrix-jmpchat:8080"

matrix_bridge_mautrix_jmpchat_msc4190_enabled: "{{ matrix_bridges_msc4190_enabled }}"
matrix_bridge_mautrix_jmpchat_self_sign_enabled: "{{ matrix_bridges_self_sign_enabled }}"

matrix_bridge_mautrix_jmpchat_extev_polls: false

matrix_bridge_mautrix_jmpchat_command_prefix: "!jmpchat"

# Displayname template for jmp.chat users.
# {{.ProfileName}} - The jmp.chat profile name set by the user.
# {{.ContactName}} - The name for the user from your phone's contact list. This is not safe on multi-user instances.
# {{.Nickname}} - The nickname set for the user in the native jmp.chat app. This is not safe on multi-user instances.
# {{.PhoneNumber}} - The phone number of the user.
# {{.UUID}} - The UUID of the jmp.chat user.
# {{.AboutEmoji}} - The emoji set by the user in their profile.
matrix_bridge_mautrix_jmpchat_network_displayname_template: '{% raw %}{{or .ProfileName .PhoneNumber "Unknown user"}} (jmp.chat){% endraw %}'
matrix_bridge_mautrix_jmpchat_network_contact_name_suffix: jmp

# CardDAV address book integration (used by `carddav-login`).
# Stored CardDAV credentials and contact names are encrypted (AES-256-GCM) with a key
# derived from the secret given to `carddav-unlock` in the management room, kept in memory only.
# Leave empty to keep the key off the disk entirely; a legacy key file at /data/carddav.key is
# still read while it exists so it can be migrated to the in-memory key.
# Set this to a path only to keep using an on-disk key file explicitly.
matrix_bridge_mautrix_jmpchat_carddav_key_file: ""

# Extra raw YAML appended to the bridge's `simple-config.yaml` (the network configuration).
# Use it for the optional `calls:` block or any other network-level option. Calling ships in the
# standard image and is enabled by default; each account opts in with `sip-login`. Calls ring in
# the phone number's own room, including encrypted ones (the bridge distributes SFrame call keys).
# For example:
#
# matrix_bridge_mautrix_jmpchat_network_configuration_extension_yaml: |
#   calls:
#     enabled: false  # disable the SIP runtime entirely (accounts cannot opt in then)
#     room_mode: call-room      # legacy: use a dedicated unencrypted call room instead
#     e2ee: off                 # never encrypt call media; encrypted rooms fall back to a call room
#     auto_create_call_room: false
#     pickle_key: change-me     # protects the bridge's call-device keys (empty derives one automatically)
matrix_bridge_mautrix_jmpchat_network_configuration_extension_yaml: ''

matrix_bridge_mautrix_jmpchat_bridge_permissions: |
  {{
    {'*': 'relay', matrix_bridge_mautrix_jmpchat_homeserver_domain: 'user'}
    | combine({matrix_admin: 'admin'} if matrix_admin else {})
  }}

# Enable bridge relay functionality
matrix_bridge_mautrix_jmpchat_bridge_relay_enabled: "{{ matrix_bridges_relay_enabled }}"

# Only allow admins on this home server to set themselves as a relay user
matrix_bridge_mautrix_jmpchat_bridge_relay_admin_only: true

matrix_bridge_mautrix_jmpchat_container_network: ""

matrix_bridge_mautrix_jmpchat_container_additional_networks: "{{ matrix_bridge_mautrix_jmpchat_container_additional_networks_auto + matrix_bridge_mautrix_jmpchat_container_additional_networks_custom }}"
matrix_bridge_mautrix_jmpchat_container_additional_networks_auto: []
matrix_bridge_mautrix_jmpchat_container_additional_networks_custom: []

# matrix_bridge_mautrix_jmpchat_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `matrix_bridge_mautrix_jmpchat_container_labels_additional_labels`.
matrix_bridge_mautrix_jmpchat_container_labels_traefik_enabled: true
matrix_bridge_mautrix_jmpchat_container_labels_traefik_docker_network: "{{ matrix_bridge_mautrix_jmpchat_container_network }}"
matrix_bridge_mautrix_jmpchat_container_labels_traefik_entrypoints: web-secure
matrix_bridge_mautrix_jmpchat_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls whether labels will be added that expose mautrix-instagram's metrics
matrix_bridge_mautrix_jmpchat_container_labels_metrics_enabled: "{{ matrix_bridge_mautrix_jmpchat_metrics_enabled and matrix_bridge_mautrix_jmpchat_metrics_proxying_enabled }}"
matrix_bridge_mautrix_jmpchat_container_labels_metrics_traefik_rule: "Host(`{{ matrix_bridge_mautrix_jmpchat_metrics_proxying_hostname }}`) && PathPrefix(`{{ matrix_bridge_mautrix_jmpchat_metrics_proxying_path_prefix }}`)"
matrix_bridge_mautrix_jmpchat_container_labels_metrics_traefik_priority: 0
matrix_bridge_mautrix_jmpchat_container_labels_metrics_traefik_entrypoints: "{{ matrix_bridge_mautrix_jmpchat_container_labels_traefik_entrypoints }}"
matrix_bridge_mautrix_jmpchat_container_labels_metrics_traefik_tls: "{{ matrix_bridge_mautrix_jmpchat_container_labels_metrics_traefik_entrypoints != 'web' }}"
matrix_bridge_mautrix_jmpchat_container_labels_metrics_traefik_tls_certResolver: "{{ matrix_bridge_mautrix_jmpchat_container_labels_traefik_tls_certResolver }}"  # noqa var-naming
matrix_bridge_mautrix_jmpchat_container_labels_metrics_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/middlewares/http/basicauth/#users
matrix_bridge_mautrix_jmpchat_container_labels_metrics_middleware_basic_auth_users: ''

# matrix_bridge_mautrix_jmpchat_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
#
# Example:
# matrix_bridge_mautrix_jmpchat_container_labels_additional_labels: |
#   my.label=1
#   another.label="here"
matrix_bridge_mautrix_jmpchat_container_labels_additional_labels: ''

# A list of extra arguments to pass to the container
matrix_bridge_mautrix_jmpchat_container_extra_arguments: []

# List of systemd services that matrix-mautrix-jmpchat.service depends on.
matrix_bridge_mautrix_jmpchat_systemd_required_services_list: "{{ matrix_bridge_mautrix_jmpchat_systemd_required_services_list_default + matrix_bridge_mautrix_jmpchat_systemd_required_services_list_auto + matrix_bridge_mautrix_jmpchat_systemd_required_services_list_custom }}"
matrix_bridge_mautrix_jmpchat_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
matrix_bridge_mautrix_jmpchat_systemd_required_services_list_auto: []
matrix_bridge_mautrix_jmpchat_systemd_required_services_list_custom: []

# List of systemd services that matrix-mautrix-jmpchat.service wants
matrix_bridge_mautrix_jmpchat_systemd_wanted_services_list: []

matrix_bridge_mautrix_jmpchat_appservice_token: ''
matrix_bridge_mautrix_jmpchat_homeserver_token: ''

matrix_bridge_mautrix_jmpchat_appservice_bot_username: jmpchatbot

# Minimum severity of journal log messages.
# Valid values: fatal, error, warn, info, debug, trace
matrix_bridge_mautrix_jmpchat_logging_level: 'warn'

# Whether or not created rooms should have federation enabled.
# If false, created portal rooms will never be federated.
matrix_bridge_mautrix_jmpchat_federate_rooms: true

matrix_bridge_mautrix_jmpchat_backfill_enabled: true
matrix_bridge_mautrix_jmpchat_backfill_max_initial_messages: 50
matrix_bridge_mautrix_jmpchat_backfill_max_catchup_messages: 500
matrix_bridge_mautrix_jmpchat_backfill_unread_hours_threshold: 720
matrix_bridge_mautrix_jmpchat_backfill_threads_max_initial_messages: 50

# Whether or not metrics endpoint should be enabled.
# Enabling them is usually enough for a local (in-container) Prometheus to consume them.
# If metrics need to be consumed by another (external) Prometheus server, consider exposing them via `matrix_bridge_mautrix_jmpchat_metrics_proxying_enabled`.
matrix_bridge_mautrix_jmpchat_metrics_enabled: false

# Controls whether metrics should be exposed on a public URL.
matrix_bridge_mautrix_jmpchat_metrics_proxying_enabled: false
matrix_bridge_mautrix_jmpchat_metrics_proxying_hostname: ''
matrix_bridge_mautrix_jmpchat_metrics_proxying_path_prefix: ''

# Database-related configuration fields.
#
# To use SQLite, stick to these defaults.
#
# To use Postgres:
# - change the engine (`matrix_bridge_mautrix_jmpchat_database_engine: 'postgres'`)
# - adjust your database credentials via the `matrix_bridge_mautrix_jmpchat_database_*` variables
matrix_bridge_mautrix_jmpchat_database_engine: 'sqlite'

matrix_bridge_mautrix_jmpchat_sqlite_database_path_local: "{{ matrix_bridge_mautrix_jmpchat_data_path }}/mautrix-jmpchat.db"
matrix_bridge_mautrix_jmpchat_sqlite_database_path_in_container: "/data/mautrix-jmpchat.db?_txlock=immediate"

matrix_bridge_mautrix_jmpchat_database_username: 'matrix_bridge_mautrix_jmpchat'
matrix_bridge_mautrix_jmpchat_database_password: 'some-password'
matrix_bridge_mautrix_jmpchat_database_hostname: ''
matrix_bridge_mautrix_jmpchat_database_port: 5432
matrix_bridge_mautrix_jmpchat_database_name: 'matrix_bridge_mautrix_jmpchat'
matrix_bridge_mautrix_jmpchat_database_sslmode: disable

matrix_bridge_mautrix_jmpchat_database_connection_string: 'postgresql://{{ matrix_bridge_mautrix_jmpchat_database_username }}:{{ matrix_bridge_mautrix_jmpchat_database_password }}@{{ matrix_bridge_mautrix_jmpchat_database_hostname }}:{{ matrix_bridge_mautrix_jmpchat_database_port }}/{{ matrix_bridge_mautrix_jmpchat_database_name }}?sslmode={{ matrix_bridge_mautrix_jmpchat_database_sslmode }}'

matrix_bridge_mautrix_jmpchat_appservice_database_type: "{{
	{
		'sqlite': 'sqlite3-fk-wal',
		'postgres':'postgres',
	}[matrix_bridge_mautrix_jmpchat_database_engine]
}}"

matrix_bridge_mautrix_jmpchat_appservice_database_uri: "{{
	{
		'sqlite': matrix_bridge_mautrix_jmpchat_sqlite_database_path_in_container,
		'postgres': matrix_bridge_mautrix_jmpchat_database_connection_string,
	}[matrix_bridge_mautrix_jmpchat_database_engine]
}}"

matrix_bridge_mautrix_jmpchat_double_puppet_secrets: "{{ matrix_bridge_mautrix_jmpchat_double_puppet_secrets_auto | combine(matrix_bridge_mautrix_jmpchat_double_puppet_secrets_custom) }}"
matrix_bridge_mautrix_jmpchat_double_puppet_secrets_auto: {}
matrix_bridge_mautrix_jmpchat_double_puppet_secrets_custom: {}

# Default mautrix-jmpchat configuration template which covers the generic use case.
# You can customize it by controlling the various variables inside it.
#
# For a more advanced customization, you can extend the default (see `matrix_bridge_mautrix_jmpchat_configuration_extension_yaml`)
# or completely replace this variable with your own template.
matrix_bridge_mautrix_jmpchat_configuration_yaml: "{{ lookup('template', 'templates/config.yaml.j2') }}"

matrix_bridge_mautrix_jmpchat_configuration_extension_yaml: |
  # Your custom YAML configuration goes here.
  # This configuration extends the default starting configuration (`matrix_bridge_mautrix_jmpchat_configuration_yaml`).
  #
  # You can override individual variables from the default configuration, or introduce new ones.
  #
  # If you need something more special, you can take full control by
  # completely redefining `matrix_bridge_mautrix_jmpchat_configuration_yaml`.

matrix_bridge_mautrix_jmpchat_configuration_extension: "{{ matrix_bridge_mautrix_jmpchat_configuration_extension_yaml | from_yaml if matrix_bridge_mautrix_jmpchat_configuration_extension_yaml | from_yaml is mapping else {} }}"

# Holds the final configuration (a combination of the default and its extension).
# You most likely don't need to touch this variable. Instead, see `matrix_bridge_mautrix_jmpchat_configuration_yaml`.
matrix_bridge_mautrix_jmpchat_configuration: "{{ matrix_bridge_mautrix_jmpchat_configuration_yaml | from_yaml | combine(matrix_bridge_mautrix_jmpchat_configuration_extension, recursive=True) }}"

matrix_bridge_mautrix_jmpchat_registration_yaml: |
  id: jmpchat
  url: {{ matrix_bridge_mautrix_jmpchat_appservice_address }}
  as_token: "{{ matrix_bridge_mautrix_jmpchat_appservice_token }}"
  hs_token: "{{ matrix_bridge_mautrix_jmpchat_homeserver_token }}"
  # See https://github.com/mautrix/signal/issues/43 (which is inherited here)
  sender_localpart: _bot_jmpchatbot
  rate_limited: false
  namespaces:
      users:
      - regex: '^@jmpchat_.*:{{ matrix_bridge_mautrix_jmpchat_homeserver_domain | regex_escape }}$'
        exclusive: true
      - exclusive: true
        regex: '^@{{ matrix_bridge_mautrix_jmpchat_appservice_bot_username | regex_escape }}:{{ matrix_bridge_mautrix_jmpchat_homeserver_domain | regex_escape }}$'
  de.sorunome.msc2409.push_ephemeral: true
  receive_ephemeral: true
  io.element.msc4190: {{ matrix_bridge_mautrix_jmpchat_msc4190_enabled | to_json }}

matrix_bridge_mautrix_jmpchat_registration: "{{ matrix_bridge_mautrix_jmpchat_registration_yaml | from_yaml }}"

# Enable End-to-bridge encryption
matrix_bridge_mautrix_jmpchat_bridge_encryption_allow: "{{ matrix_bridges_encryption_enabled }}"
matrix_bridge_mautrix_jmpchat_bridge_encryption_default: "{{ matrix_bridges_encryption_default }}"
# Whether the matrix-leg of all bridge chats must be encrypted to the bot.
# Defaults to requiring encryption so plaintext bot conversations cannot occur.
matrix_bridge_mautrix_jmpchat_bridge_encryption_require: "{{ matrix_bridges_encryption_require | default(true) }}"
matrix_bridge_mautrix_jmpchat_bridge_encryption_key_sharing_allow: "{{ matrix_bridge_mautrix_jmpchat_bridge_encryption_allow }}"

matrix_bridge_mautrix_jmpchat_bridge_personal_filtering_spaces: true

matrix_bridge_mautrix_jmpchat_network_note_to_self_avatar: "mxc://maunium.net/REBIVrqjZwmaWpssCZpBlmlL"

matrix_bridge_mautrix_jmpchat_provisioning_shared_secret: ''
matrix_bridge_mautrix_jmpchat_public_media_signing_key: ''

# matrix_bridge_mautrix_jmpchat_restart_necessary controls whether the service
# will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
matrix_bridge_mautrix_jmpchat_restart_necessary: false
