---

- name: Check existence of matrix-android-sms-mms-agent service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/matrix-android-sms-mms-agent.service"
  register: matrix_android_sms_mms_agent_service_stat

- when: matrix_android_sms_mms_agent_service_stat.stat.exists | bool
  block:
    - name: Ensure matrix-android-sms-mms-agent is stopped
      ansible.builtin.service:
        name: matrix-android-sms-mms-agent
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure matrix-android-sms-mms-agent.service doesn't exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/matrix-android-sms-mms-agent.service"
        state: absent
