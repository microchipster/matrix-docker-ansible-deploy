---

- tags:
    - setup-all
    - setup-android-sms-mms-agent
    - install-all
    - install-android-sms-mms-agent
  block:
    - when: matrix_android_sms_mms_agent_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"

    - when: matrix_android_sms_mms_agent_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/setup_install.yml"

- tags:
    - setup-all
    - setup-android-sms-mms-agent
  block:
    - when: not matrix_android_sms_mms_agent_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/setup_uninstall.yml"
