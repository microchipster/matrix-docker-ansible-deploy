---

- name: Ensure text-a-day paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0750'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  with_items:
    - { path: "{{ matrix_bot_text_a_day_base_path }}", when: true }
    - { path: "{{ matrix_bot_text_a_day_config_path }}", when: true }
    - { path: "{{ matrix_bot_text_a_day_data_path }}", when: true }
    - { path: "{{ matrix_bot_text_a_day_container_src_files_path }}", when: "{{ matrix_bot_text_a_day_container_image_self_build }}" }
  when: "item.when | bool"

- name: Install word histogram from the configured server path
  ansible.builtin.copy:
    src: "{{ matrix_bot_text_a_day_word_histogram_server_path }}"
    dest: "{{ matrix_bot_text_a_day_word_histogram_path }}"
    remote_src: true
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
    mode: '0640'
  when: matrix_bot_text_a_day_word_histogram_server_path | string | trim | length > 0
  register: matrix_bot_text_a_day_word_histogram_result

- name: Install quote corpus from the configured server path
  ansible.builtin.copy:
    src: "{{ matrix_bot_text_a_day_quote_corpus_server_path }}"
    dest: "{{ matrix_bot_text_a_day_data_path }}/{{ matrix_bot_text_a_day_quote_corpus_server_path | basename }}"
    remote_src: true
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
    mode: '0640'
  register: matrix_bot_text_a_day_quote_corpus_result

- name: Install word histogram from the configured HTTP endpoint
  ansible.builtin.get_url:
    url: "{{ matrix_bot_text_a_day_word_histogram_url }}"
    dest: "{{ matrix_bot_text_a_day_word_histogram_path }}"
    force: true
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
    mode: '0640'
  when: matrix_bot_text_a_day_word_histogram_url | string | trim | length > 0
  register: matrix_bot_text_a_day_word_histogram_result

- name: Check if the cached dictionary data already exists
  ansible.builtin.stat:
    path: "{{ matrix_bot_text_a_day_data_path }}/dictionary.db"
  register: matrix_bot_text_a_day_dictionary_stat

- name: Download WordNet-shaped dictionary data once from the frozen upstream URL
  ansible.builtin.get_url:
    url: "https://github.com/caarmen/poet-assistant/raw/48b9991fcb23c3b0e324198bf42e6d16d2b8fc88/app/src/main/assets/poet_assistant.db"
    dest: "{{ matrix_bot_text_a_day_data_path }}/dictionary.db"
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
    mode: '0640'
  when: not matrix_bot_text_a_day_dictionary_stat.stat.exists | bool or matrix_bot_text_a_day_dictionary_stat.stat.size | default(0, true) | int == 0
  register: matrix_bot_text_a_day_dictionary_result

- name: Ensure text-a-day container image is pulled
  community.docker.docker_image_pull:
    name: "{{ matrix_bot_text_a_day_container_image }}"
    pull: always
  when: "not matrix_bot_text_a_day_container_image_self_build | bool"
  register: matrix_bot_text_a_day_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: matrix_bot_text_a_day_container_image_pull_result is not failed

# A checkout owned by a different user (a uid change, an earlier clone by another user, etc.) would make the git task below fail on ownership or permissions.
- name: Ensure text-a-day repository ownership is correct on self-build
  ansible.builtin.file:
    path: "{{ matrix_bot_text_a_day_container_src_files_path }}"
    state: directory
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
    recurse: true
  when: "matrix_bot_text_a_day_container_image_self_build | bool"

- name: Ensure text-a-day repository is present on self-build
  ansible.builtin.git:
    repo: "{{ matrix_bot_text_a_day_container_image_self_build_repo }}"
    dest: "{{ matrix_bot_text_a_day_container_src_files_path }}"
    version: "{{ matrix_bot_text_a_day_container_image_self_build_branch }}"
    force: "yes"
  become: true
  become_user: "{{ matrix_user_name }}"
  register: matrix_bot_text_a_day_git_pull_results
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: matrix_bot_text_a_day_git_pull_results is not failed
  when: "matrix_bot_text_a_day_container_image_self_build | bool"

- name: Ensure text-a-day Docker image is built
  community.docker.docker_image_build:
    name: "{{ matrix_bot_text_a_day_container_image }}"
    dockerfile: Dockerfile
    path: "{{ matrix_bot_text_a_day_container_src_files_path }}"
    pull: true
    rebuild: "{{ 'always' if matrix_bot_text_a_day_git_pull_results.changed | bool else 'never' }}"
  when: "matrix_bot_text_a_day_container_image_self_build | bool"
  register: matrix_bot_text_a_day_container_image_build_result

- name: Check if text-a-day Docker image exists
  ansible.builtin.command: "{{ devture_systemd_docker_base_host_command_docker }} images --quiet --filter 'reference={{ matrix_bot_text_a_day_container_image }}'"
  register: matrix_bot_text_a_day_container_image_check_result
  changed_when: false
  when: "matrix_bot_text_a_day_container_image_self_build | bool"

- name: Fail if text-a-day Docker image is missing after self-build
  ansible.builtin.fail:
    msg: >-
      Text-a-day is configured for self-build, but no local Docker image tagged
      {{ matrix_bot_text_a_day_container_image }} exists after the build step.
      Check the build logs and verify the Docker daemon/context used by Ansible
      matches the one systemd will use at runtime.
  when:
    - matrix_bot_text_a_day_container_image_self_build | bool
    - matrix_bot_text_a_day_container_image_check_result.stdout | trim | length == 0

# matrix-user-creator intentionally skips install-all. Text-a-day needs a token
# during this install, so create only its account here as well as via the normal
# ensure-users-created hook in setup.yml.
- name: Ensure text-a-day Matrix account exists before token generation
  ansible.builtin.include_role:
    name: custom/matrix-user-creator
    tasks_from: setup.yml
  vars:
    matrix_user_creator_users:
      - username: "{{ matrix_bot_text_a_day_config_user_mxid_localpart }}"
        initial_password: "{{ matrix_bot_text_a_day_config_user_password }}"
        initial_type: bot
  when: matrix_bot_text_a_day_config_user_password | string | trim | length > 0

- name: Check if a saved access token already exists
  ansible.builtin.stat:
    path: "{{ matrix_bot_text_a_day_matrix_access_token_file_path }}"
  register: matrix_bot_text_a_day_access_token_stat

- name: Read saved access token if present
  ansible.builtin.slurp:
    src: "{{ matrix_bot_text_a_day_matrix_access_token_file_path }}"
  register: matrix_bot_text_a_day_access_token_file
  when: matrix_bot_text_a_day_access_token_stat.stat.exists | bool

- name: Set access token from saved file
  ansible.builtin.set_fact:
    matrix_bot_text_a_day_matrix_access_token: "{{ matrix_bot_text_a_day_access_token_file.content | b64decode | trim }}"
  when: matrix_bot_text_a_day_access_token_stat.stat.exists | bool

- name: Generate a Matrix access token if needed
  when: matrix_bot_text_a_day_matrix_access_token | string | trim | length == 0
  block:
    - name: Request a Matrix access token with the bot password
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} run --rm
          --network={{ matrix_bot_text_a_day_matrix_login_network }}
          --entrypoint=/usr/bin/curl {{ matrix_bot_text_a_day_container_image }}
          -sS -H {{ 'Content-Type: application/json' | quote }}
          -d {{ {
            'type': 'm.login.password',
            'identifier': {
              'type': 'm.id.user',
              'user': matrix_bot_text_a_day_config_user_id
            },
            'password': matrix_bot_text_a_day_config_user_password
          } | to_json | quote }}
          {{ (matrix_bot_text_a_day_config_homeserver_url ~ '/_matrix/client/v3/login') | quote }}
      no_log: false
      register: matrix_bot_text_a_day_access_token_result
      changed_when: true

    - name: Parse the Matrix access-token response
      ansible.builtin.set_fact:
        matrix_bot_text_a_day_access_token_response: "{{ matrix_bot_text_a_day_access_token_result.stdout | from_json }}"

    - name: Fail if Matrix did not return an access token
      ansible.builtin.fail:
        msg: >-
          Matrix login failed
          ({{ matrix_bot_text_a_day_access_token_response.errcode | default('unknown') }}):
          {{ matrix_bot_text_a_day_access_token_response.error | default('no access token returned') }}
      when: matrix_bot_text_a_day_access_token_response.access_token | default('') | trim | length == 0

    - name: Save the generated Matrix access token
      ansible.builtin.copy:
        content: "{{ matrix_bot_text_a_day_access_token_response.access_token | trim }}"
        dest: "{{ matrix_bot_text_a_day_matrix_access_token_file_path }}"
        mode: '0600'
        owner: "{{ matrix_user_name }}"
        group: "{{ matrix_group_name }}"
      register: matrix_bot_text_a_day_access_token_file_result

    - name: Set access token fact from generated token
      ansible.builtin.set_fact:
        matrix_bot_text_a_day_matrix_access_token: "{{ matrix_bot_text_a_day_access_token_response.access_token }}"

- name: Ensure saved access token file matches the configured token
  ansible.builtin.copy:
    content: "{{ matrix_bot_text_a_day_matrix_access_token | trim }}"
    dest: "{{ matrix_bot_text_a_day_matrix_access_token_file_path }}"
    mode: '0600'
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
  register: matrix_bot_text_a_day_access_token_sync_result

- name: Ensure text-a-day configuration installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/config.yaml.j2"
    dest: "{{ matrix_bot_text_a_day_config_path }}/config.yaml"
    owner: "{{ matrix_user_name }}"
    group: "{{ matrix_group_name }}"
    mode: '0640'
  register: matrix_bot_text_a_day_config_result

- name: Ensure text-a-day container network is created
  when: matrix_bot_text_a_day_container_network != 'host'
  community.general.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ matrix_bot_text_a_day_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"

- name: Ensure matrix-bot-text-a-day.service installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/matrix-bot-text-a-day.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/matrix-bot-text-a-day.service"
    mode: '0644'
  register: matrix_bot_text_a_day_systemd_service_result

- name: Determine whether text-a-day needs a restart
  ansible.builtin.set_fact:
    matrix_bot_text_a_day_restart_necessary: >-
      {{
        (matrix_bot_text_a_day_access_token_file_result is defined and matrix_bot_text_a_day_access_token_file_result.changed | bool)
      or matrix_bot_text_a_day_access_token_sync_result.changed | default(false)
      or matrix_bot_text_a_day_config_result.changed | default(false)
      or matrix_bot_text_a_day_word_histogram_result.changed | default(false)
      or matrix_bot_text_a_day_quote_corpus_result.changed | default(false)
      or (matrix_bot_text_a_day_dictionary_result is defined and matrix_bot_text_a_day_dictionary_result.changed | bool)
      or matrix_bot_text_a_day_systemd_service_result.changed | default(false)
      or matrix_bot_text_a_day_container_image_pull_result.changed | default(false)
      or matrix_bot_text_a_day_git_pull_results.changed | default(false)
      or matrix_bot_text_a_day_container_image_build_result.changed | default(false)
      }}
