---

- tags:
    - setup-all
    - setup-mautrix-android-sms-mms
    - install-all
    - install-mautrix-android-sms-mms
  block:
    - when: matrix_bridge_mautrix_android_sms_mms_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"

    - when: matrix_bridge_mautrix_android_sms_mms_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/setup_install.yml"

- tags:
    - setup-all
    - setup-mautrix-android-sms-mms
  block:
    - when: not matrix_bridge_mautrix_android_sms_mms_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/setup_uninstall.yml"
