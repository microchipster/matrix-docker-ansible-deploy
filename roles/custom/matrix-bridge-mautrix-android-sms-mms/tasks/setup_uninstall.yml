---

- name: Check existence of matrix-mautrix-android-sms-mms service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/matrix-mautrix-android-sms-mms.service"
  register: matrix_bridge_mautrix_android_sms_mms_service_stat

- when: matrix_bridge_mautrix_android_sms_mms_service_stat.stat.exists | bool
  block:
    - name: Ensure matrix-mautrix-android-sms-mms is stopped
      ansible.builtin.service:
        name: matrix-mautrix-android-sms-mms
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure matrix-mautrix-android-sms-mms.service doesn't exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/matrix-mautrix-android-sms-mms.service"
        state: absent
